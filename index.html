<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Offline & Online</title>
    <meta name="theme-color" content="#121212">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: white; padding-bottom: 120px; }
        
        header {
            background: linear-gradient(to bottom, #1db954, #121212);
            padding: 25px 20px 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { font-size: 22px; }
        .status-badge {
            font-size: 11px; padding: 4px 10px; border-radius: 12px;
            background: rgba(0,0,0,0.5); font-weight: bold;
        }
        .status-online { color: #1db954; }
        .status-offline { color: #ff5555; }

        .action-bar {
            padding: 10px 20px; display: flex; gap: 10px; flex-wrap: wrap;
        }
        .btn-scan {
            background: #1db954; color: black; border: none; padding: 10px 16px;
            border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-clear {
            background: #282828; color: #ff6b6b; border: none; padding: 10px 14px;
            border-radius: 20px; font-size: 12px; cursor: pointer;
        }

        .search-box { padding: 5px 20px 15px; }
        .search-box input {
            width: 100%; padding: 12px 15px; border-radius: 25px; border: none;
            background: #282828; color: white; font-size: 14px; outline: none;
        }

        .tabs { display: flex; padding: 0 20px 10px; gap: 10px; }
        .tab {
            padding: 6px 14px; border-radius: 15px; background: #282828;
            font-size: 12px; cursor: pointer; color: #b3b3b3;
        }
        .tab.active { background: #1db954; color: black; font-weight: bold; }

        .song-list { padding: 0 20px; }
        .song-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer;
            transition: background 0.2s;
        }
        .song-item:hover, .song-item.active { background: #282828; }
        .song-left { display: flex; align-items: center; overflow: hidden; }
        .song-left img { width: 48px; height: 48px; border-radius: 6px; margin-right: 12px; object-fit: cover; flex-shrink: 0; }
        .song-info { overflow: hidden; }
        .song-info h4 { font-size: 14px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { font-size: 12px; color: #b3b3b3; }
        .song-item.active .song-info h4 { color: #1db954; }
        .tag-type {
            font-size: 10px; padding: 2px 6px; border-radius: 4px;
            background: #333; color: #ccc; flex-shrink: 0; margin-left: 8px;
        }

        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #181818; border-top: 1px solid #282828;
            padding: 12px 20px; display: flex; flex-direction: column; gap: 8px;
        }
        .player-top { display: flex; justify-content: space-between; align-items: center; }
        .now-playing { display: flex; align-items: center; gap: 10px; max-width: 60%; }
        .now-playing img { width: 42px; height: 42px; border-radius: 4px; object-fit: cover; }
        .now-playing div { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .now-playing h5 { font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
        .now-playing span { font-size: 11px; color: #b3b3b3; }

        .controls { display: flex; align-items: center; gap: 14px; }
        .controls button { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
        .controls .play-btn {
            background: #1db954; color: black; width: 40px; height: 40px;
            border-radius: 50%; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        input[type="range"] { width: 100%; accent-color: #1db954; height: 4px; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>My Spotify</h1>
            <p style="font-size: 12px; color: #ddd;">Online & Offline Player</p>
        </div>
        <span id="netStatus" class="status-badge status-online">● Online</span>
    </header>

    <div class="action-bar">
        <button class="btn-scan" onclick="triggerScan()">📂 Scan Musik dari HP</button>
        <button class="btn-clear" onclick="clearOfflineSongs()">🗑 Hapus Musik HP</button>
        <!-- Input tersembunyi untuk memilih banyak file audio sekaligus dari HP -->
        <input type="file" id="fileScanner" accept="audio/*" multiple style="display:none" onchange="handleFiles(this.files)">
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari lagu online atau dari HP..." onkeyup="renderSongs()">
    </div>

    <div class="tabs">
        <div class="tab active" onclick="setFilter('all', this)">Semua</div>
        <div class="tab" onclick="setFilter('offline', this)">Musik HP (Offline)</div>
        <div class="tab" onclick="setFilter('online', this)">Streaming (Online)</div>
    </div>

    <div class="song-list" id="songList"></div>

    <div class="player-bar">
        <div class="player-top">
            <div class="now-playing">
                <img id="coverImg" src="https://unsplash.com" alt="Cover">
                <div>
                    <h5 id="trackTitle">Pilih Lagu</h5>
                    <span id="trackArtist">Siap memutar musik</span>
                </div>
            </div>
            <div class="controls">
                <button onclick="prevSong()">⏮</button>
                <button class="play-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
                <button onclick="nextSong()">⏭</button>
            </div>
        </div>
        <input type="range" id="progressBar" value="0" min="0" max="100" onchange="seekAudio()">
    </div>

    <audio id="audioPlayer" ontimeupdate="updateProgress()" onended="nextSong()"></audio>

    <script>
        // 1. Daftar Lagu Online Bawaan
        const onlineSongs = [
            {
                id: 'on-1',
                title: "SoundHelix Song 1",
                artist: "T. Schürger (Online)",
                cover: "https://unsplash.com",
                src: "https://soundhelix.com",
                type: "online"
            },
            {
                id: 'on-2',
                title: "SoundHelix Song 2",
                artist: "Electronic Beats (Online)",
                cover: "https://unsplash.com",
                src: "https://soundhelix.com",
                type: "online"
            }
        ];

        let offlineSongs = [];
        let allSongs = [...onlineSongs];
        let currentFilter = 'all';
        let currentSongId = null;
        let isPlaying = false;
        const audio = document.getElementById("audioPlayer");

        // 2. Deteksi Status Internet (Online / Offline)
        function updateNetworkStatus() {
            const badge = document.getElementById("netStatus");
            if (navigator.onLine) {
                badge.innerText = "● Online";
                badge.className = "status-badge status-online";
            } else {
                badge.innerText = "● Offline Mode";
                badge.className = "status-badge status-offline";
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // 3. Database Lokal HP (IndexedDB) agar lagu hasil scan tersimpan permanen
        let db;
        const request = indexedDB.open("SpotifyOfflineDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("songs", { keyPath: "id" });
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            loadSavedOfflineSongs();
        };

        function loadSavedOfflineSongs() {
            const tx = db.transaction("songs", "readonly");
            const store = tx.objectStore("songs");
            const getAll = store.getAll();
            getAll.onsuccess = () => {
                offlineSongs = getAll.result.map(item => ({
                    id: item.id,
                    title: item.title,
                    artist: "Memori HP (Offline)",
                    cover: "https://unsplash.com",
                    src: URL.createObjectURL(item.file),
                    type: "offline"
                }));
                allSongs = [...offlineSongs, ...onlineSongs];
                renderSongs();
            };
        }

        // 4. Fitur Scan Musik dari HP
        function triggerScan() {
            document.getElementById("fileScanner").click();
        }

        function handleFiles(files) {
            if (!files.length) return;
            const tx = db.transaction("songs", "readwrite");
            const store = tx.objectStore("songs");

            Array.from(files).forEach((file, idx) => {
                const cleanTitle = file.name.replace(/\.[^/.]+$/, "");
                const songRecord = {
                    id: 'off-' + Date.now() + '-' + idx,
                    title: cleanTitle,
                    file: file
                };
                store.put(songRecord);
            });

            tx.oncomplete = () => {
