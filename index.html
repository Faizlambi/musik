<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusikKu Pro - Offline & Streaming</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff;padding:16px;padding-bottom:180px;transition:.3s}
body.light{background:#f5f5f5;color:#111}
body.light .box,body.light .song,body.light .player{background:#fff;color:#111}
h1{color:#1ed760} .sub{color:#aaa;font-size:13px;margin:4px 0 14px}
.box{background:#1e1e1e;border-radius:16px;padding:14px;margin-bottom:12px}
input,button,select,textarea{width:100%;padding:11px;border-radius:10px;border:none;margin-top:8px;font-size:14px}
input,textarea,select{background:#2a2a2a;color:#fff;outline:none}
.btn{background:#1ed760;color:#000;font-weight:bold;cursor:pointer}
.btn2{background:#333;color:#fff;cursor:pointer}
.btn3{background:#ff4757;color:#fff;cursor:pointer}
.song{display:flex;gap:10px;align-items:center;background:#1e1e1e;padding:10px;border-radius:12px;margin-bottom:8px;cursor:pointer}
.song img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#333}
.song b{font-size:14px} .song span{font-size:12px;color:#aaa}
.player{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;padding:12px;border-top:1px solid #333;z-index:99}
.controls{display:flex;gap:8px;justify-content:center;margin:8px 0}
.controls button{width:46px;height:46px;border-radius:50%;background:#1ed760;font-size:17px;cursor:pointer}
audio{width:100%} .row{display:flex;gap:8px} .row button{flex:1}
.eq{display:flex;gap:10px;margin-top:10px} .eq div{flex:1;text-align:center;font-size:12px}
.eq input{accent-color:#1ed760}
.lyrics{background:#111;padding:12px;border-radius:12px;white-space:pre-wrap;font-size:13px;line-height:1.6;margin-top:10px;max-height:180px;overflow:auto}
body.light .lyrics{background:#eee}
.badge{font-size:11px;background:#1ed760;color:#000;padding:2px 7px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>

<div style="display:flex;justify-content:space-between;align-items:center">
<h1>🎵 MusikKu <span style="color:#fff;font-size:14px">PRO</span></h1>
<button onclick="toggleTheme()" style="width:auto;padding:8px 14px;background:#333;color:#fff;border-radius:20px;cursor:pointer">🌙 / ☀️</button>
</div>
<p class="sub">Offline + Streaming + Download + Lirik + Equalizer</p>

<div class="box">
<b>➕ Tambah Lagu Streaming</b>
<input id="title" placeholder="Judul lagu">
<input id="artist" placeholder="Penyanyi">
<input id="url" placeholder="Link MP3: https://.../lagu.mp3">
<textarea id="lyricInput" placeholder="Paste lirik lagu di sini (opsional)"></textarea>
<button class="btn" onclick="addStream()">Tambah & Putar</button>
</div>

<div class="box">
<b>📂 Tambah Offline dari HP</b>
<input type="file" id="fileInput" accept="audio/*" multiple>
<button class="btn2" onclick="saveOffline()">Simpan Offline</button>
<p style="font-size:11px;color:#aaa;margin-top:6px">File dari HP langsung bisa diputar tanpa internet</p>
</div>

<div class="box">
<b>🔍 Cari & Filter</b>
<input id="search" placeholder="Cari judul / penyanyi..." oninput="render()">
<div class="row">
<button class="btn2" onclick="filter='all';render()">Semua</button>
<button class="btn2" onclick="filter='offline';render()">📴 Offline</button>
<button class="btn2" onclick="filter='stream';render()">🌐 Streaming</button>
</div>
</div>

<h3 style="margin:10px 0">🎶 Playlist Kamu (<span id="count">0</span>)</h3>
<div id="list"></div>

<div class="player">
<b id="nowPlaying">Belum ada lagu diputar</b> <span id="modeBadge"></span>
<div class="controls">
<button onclick="prev()">⏮</button>
<button onclick="togglePlay()" id="playBtn">▶</button>
<button onclick="next()">⏭</button>
<button onclick="toggleShuffle()" id="shuffleBtn" style="background:#333;color:#fff;font-size:13px">🔀</button>
<button onclick="toggleRepeat()" id="repeatBtn" style="background:#333;color:#fff;font-size:13px">🔁</button>
</div>
<audio id="audio" controls></audio>

<div class="eq">
<div>BASS<br><input type="range" min="-10" max="10" value="0" oninput="setEQ()"></div>
<div>VOCAL<br><input type="range" min="-10" max="10" value="0" oninput="setEQ()"></div>
<div>TREBLE<br><input type="range" min="-10" max="10" value="0" oninput="setEQ()"></div>
</div>
<div class="row">
<button class="btn2" onclick="downloadCurrent()">⬇️ Download Jadi Offline</button>
<button class="btn2" onclick="showLyric()">🎤 Lirik</button>
</div>
<div id="lyricBox" class="lyrics" style="display:none">Belum ada lirik</div>
</div>

<script>
let songs = JSON.parse(localStorage.getItem('songs_v2')||'[]');
let filter='all', current=0, shuffle=false, repeat=false;
let audio=document.getElementById('audio');
let ctx, src, bassF, midF, treF;

if(songs.length===0){
 songs=[
  {title:'SoundHelix 1',artist:'Streaming Demo',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',lyric:'Ini contoh lirik...\nNyanyi bareng yuk...',offline:false},
  {title:'SoundHelix 2',artist:'Streaming Demo',url:'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',lyric:'Lirik lagu kedua...',offline:false},
 ]; save();
}
function save(){localStorage.setItem('songs_v2',JSON.stringify(songs))}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 let html='', c=0;
 songs.forEach((s,i)=>{
  if(q && !(s.title+s.artist).toLowerCase().includes(q)) return;
  if(filter=='offline' && !s.offline) return;
  if(filter=='stream' && s.offline) return;
  c++;
  html+=`<div class="song" onclick="playSong(${i})">
  <img src="https://via.placeholder.com/52/1ed760/000?text=🎵">
  <div style="flex:1"><b>${s.title}</b><br><span>${s.artist} • ${s.offline?'📴 Offline':'🌐 Streaming'}</span></div>
  <button onclick="event.stopPropagation();downloadOne(${i})" style="width:auto;padding:6px 10px;background:#1ed760;border-radius:20px;cursor:pointer">⬇️</button>
  <span onclick="event.stopPropagation();del(${i})">🗑️</span></div>`;
 });
 document.getElementById('list').innerHTML=html||'<p style="color:#aaa">Ga ketemu lagu</p>';
 document.getElementById('count').innerText=c;
}
function playSong(i){
 current=i; let s=songs[i];
 document.getElementById('nowPlaying').innerText='▶ '+s.title+' - '+s.artist;
 document.getElementById('lyricBox').innerText=s.lyric||'Belum ada lirik untuk lagu ini';
 document.getElementById('lyricBox').style.display='none';
 audio.src=s.url; audio.play();
 document.getElementById('playBtn').innerText='⏸';
 initEQ();
}
function togglePlay(){
 if(audio.paused){audio.play();document.getElementById('playBtn').innerText='⏸'}
 else{audio.pause();document.getElementById('playBtn').innerText='▶'}
}
function next(){ if(shuffle){playSong(Math.floor(Math.random()*songs.length))} else {playSong((current+1)%songs.length)} }
function prev(){ playSong((current-1+songs.length)%songs.length) }
function toggleShuffle(){ shuffle=!shuffle; document.getElementById('shuffleBtn').style.background=shuffle?'#1ed760':'#333'; document.getElementById('modeBadge').innerText=shuffle?' 🔀 Shuffle':'' }
function toggleRepeat(){ repeat=!repeat; audio.loop=repeat; document.getElementById('repeatBtn').style.background=repeat?'#1ed760':'#333'; }
function addStream(){
 let t=document.getElementById('title').value||'Lagu Baru';
 let a=document.getElementById('artist').value||'Unknown';
 let u=document.getElementById('url').value;
 let l=document.getElementById('lyricInput').value;
 if(!u) return alert('Paste dulu link MP3 nya!');
 songs.push({title:t,artist:a,url:u,lyric:l,offline:false}); save(); render(); playSong(songs.length-1);
}
function saveOffline(){
 let files=document.getElementById('fileInput').files;
 if(!files.length) return alert('Pilih file MP3 dulu!');
 [...files].forEach(f=>{
  songs.push({title:f.name.replace('.mp3',''),artist:'Offline - HP',url:URL.createObjectURL(f),lyric:'',offline:true});
 });
 save(); render(); alert('Berhasil disimpan offline!');
}
async function downloadOne(i){
 try{
  let s=songs[i]; let res=await fetch(s.url); let blob=await res.blob();
  let url=URL.createObjectURL(blob);
  songs[i]={...s,url:url,offline:true}; save(); render();
  alert('✅ '+s.title+' udah jadi offline!');
 }catch(e){ alert('Gagal download, coba link MP3 lain / pake CORS. Atau upload manual dari HP.'); }
}
function downloadCurrent(){ if(songs[current]) downloadOne(current); }
function showLyric(){ let b=document.getElementById('lyricBox'); b.style.display=b.style.display=='none'?'block':'none'; }
function del(i){ songs.splice(i,1); save(); render(); }
function toggleTheme(){ document.body.classList.toggle('light'); }
function initEQ(){
 if(ctx) return;
 try{
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  src=ctx.createMediaElementSource(audio);
  bassF=ctx.createBiquadFilter(); bassF.type='lowshelf'; bassF.frequency.value=200;
  midF=ctx.createBiquadFilter(); midF.type='peaking'; midF.frequency.value=1000;
  treF=ctx.createBiquadFilter(); treF.type='highshelf'; treF.frequency.value=3000;
  src.connect(bassF); bassF.connect(midF); midF.connect(treF); treF.connect(ctx.destination);
 }catch(e){}
}
function setEQ(){
 let v=document.querySelectorAll('.eq input');
 if(!bassF) return;
 bassF.gain.value=v[0].value; midF.gain.value=v[1].value; treF.gain.value=v[2].value;
}
audio.onended=()=>{ if(!repeat) next(); };
render();
</script>
</body>
</html>
