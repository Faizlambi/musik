<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Spotify APK</title>
    <meta name="theme-color" content="#121212">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: white; padding-bottom: 130px; }
        
        header {
            background: linear-gradient(to bottom, #1db954, #121212);
            padding: 25px 20px 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { font-size: 22px; }
        .status-badge {
            font-size: 11px; padding: 4px 10px; border-radius: 12px;
            background: rgba(0,0,0,0.5); font-weight: bold;
        }
        .status-online { color: #1db954; }
        .status-offline { color: #ff5555; }

        .action-bar {
            padding: 10px 20px; display: flex; gap: 10px; flex-wrap: wrap;
        }
        .btn-scan {
            background: #1db954; color: black; border: none; padding: 11px 16px;
            border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer;
        }
        .btn-clear {
            background: #282828; color: #ff6b6b; border: none; padding: 11px 14px;
            border-radius: 20px; font-size: 12px; cursor: pointer;
        }

        .search-box { padding: 5px 20px 12px; display: flex; gap: 8px; }
        .search-box input {
            flex: 1; padding: 12px 15px; border-radius: 25px; border: none;
            background: #282828; color: white; font-size: 14px; outline: none;
        }
        .search-box button {
            background: #1db954; color: black; border: none; padding: 0 16px;
            border-radius: 25px; font-weight: bold; font-size: 13px; cursor: pointer;
        }

        .tabs { display: flex; padding: 0 20px 12px; gap: 8px; }
        .tab {
            padding: 7px 14px; border-radius: 15px; background: #282828;
            font-size: 12px; cursor: pointer; color: #b3b3b3;
        }
        .tab.active { background: #1db954; color: black; font-weight: bold; }

        .song-list { padding: 0 20px; }
        .song-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer;
            background: #181818;
        }
        .song-item.active { background: #282828; border-left: 3px solid #1db954; }
        .song-left { display: flex; align-items: center; overflow: hidden; }
        .song-left img { width: 48px; height: 48px; border-radius: 6px; margin-right: 12px; object-fit: cover; flex-shrink: 0; }
        .song-info { overflow: hidden; }
        .song-info h4 { font-size: 14px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { font-size: 12px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-item.active .song-info h4 { color: #1db954; }
        .tag-type {
            font-size: 10px; padding: 3px 7px; border-radius: 4px;
            background: #333; color: #ccc; flex-shrink: 0; margin-left: 8px;
        }

        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #181818; border-top: 1px solid #282828;
            padding: 12px 20px; display: flex; flex-direction: column; gap: 8px;
        }
        .player-top { display: flex; justify-content: space-between; align-items: center; }
        .now-playing { display: flex; align-items: center; gap: 10px; max-width: 60%; }
        .now-playing img { width: 42px; height: 42px; border-radius: 4px; object-fit: cover; }
        .now-playing div { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .now-playing h5 { font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
        .now-playing span { font-size: 11px; color: #b3b3b3; }

        .controls { display: flex; align-items: center; gap: 14px; }
        .controls button { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
        .controls .play-btn {
            background: #1db954; color: black; width: 40px; height: 40px;
            border-radius: 50%; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        input[type="range"] { width: 100%; accent-color: #1db954; height: 4px; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>My Spotify</h1>
            <p style="font-size: 12px; color: #ddd;">Online Streaming & Offline HP</p>
        </div>
        <span id="netStatus" class="status-badge status-online">● Online</span>
    </header>

    <div class="action-bar">
        <button class="btn-scan" onclick="triggerScan()">📂 Pilih / Scan Lagu HP</button>
        <button class="btn-clear" onclick="clearOfflineSongs()">🗑 Hapus Daftar HP</button>
        <!-- Tanpa atribut accept ketat agar tidak diblokir pemilih file Android -->
        <input type="file" id="fileScanner" multiple style="display:none" onchange="handleFiles(this.files)">
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ketik judul lagu / artis..." onkeyup="if(event.key==='Enter') searchOnlineMusic()">
        <button onclick="searchOnlineMusic()">Cari Online</button>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab-all" onclick="setFilter('all')">Semua</div>
        <div class="tab" id="tab-offline" onclick="setFilter('offline')">Musik HP</div>
        <div class="tab" id="tab-online" onclick="setFilter('online')">Streaming Online</div>
    </div>

    <div class="song-list" id="songList"></div>

    <div class="player-bar">
        <div class="player-top">
            <div class="now-playing">
                <img id="coverImg" src="https://unsplash.com" alt="Cover">
                <div>
                    <h5 id="trackTitle">Pilih Lagu</h5>
                    <span id="trackArtist">Siap memutar musik</span>
                </div>
            </div>
            <div class="controls">
                <button onclick="prevSong()">⏮</button>
                <button class="play-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
                <button onclick="nextSong()">⏭</button>
            </div>
        </div>
        <input type="range" id="progressBar" value="0" min="0" max="100" onchange="seekAudio()">
    </div>

    <audio id="audioPlayer" playsinline ontimeupdate="updateProgress()" onended="nextSong()" onerror="handleAudioError()"></audio>

    <script>
        let onlineSongs = [];
        let offlineSongs = [];
        let allSongs = [];
        let currentFilter = 'all';
        let currentSongId = null;
        let isPlaying = false;
        const audio = document.getElementById("audioPlayer");

        // 1. Cek Status Koneksi
        function updateNetworkStatus() {
            const badge = document.getElementById("netStatus");
            if (navigator.onLine) {
                badge.innerText = "● Online";
                badge.className = "status-badge status-online";
            } else {
                badge.innerText = "● Offline";
                badge.className = "status-badge status-offline";
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        updateNetworkStatus();

        // 2. Pencarian & Streaming Lagu Online (Server HTTPS Apple/iTunes)
        async function searchOnlineMusic(defaultQuery = "indonesian pop") {
            const inputVal = document.getElementById("searchInput").value.trim();
            const query = inputVal || defaultQuery;
            const listEl = document.getElementById("songList");

            if (!navigator.onLine) {
                alert("HP sedang offline. Menampilkan lagu dari memori HP.");
                setFilter('offline');
                return;
            }

            listEl.innerHTML = `<p style="text-align:center; color:#1db954; margin-top:20px;">Mencari lagu "${query}"...</p>`;

            try {
                const res = await fetch(`https://apple.com{encodeURIComponent(query)}&entity=song&limit=20`);
                const data = await res.json();

                onlineSongs = data.results
                    .filter(item => item.previewUrl)
                    .map(item => ({
                        id: 'on-' + item.trackId,
                        title: item.trackName,
                        artist: item.artistName,
                        cover: item.artworkUrl100.replace('100x100', '300x300'),
                        src: item.previewUrl,
                        type: "online"
                    }));

                mergeAndRender();
            } catch (err) {
                listEl.innerHTML = `<p style="text-align:center; color:#ff6b6b; margin-top:20px;">Gagal memuat streaming online. Periksa koneksi internet.</p>`;
            }
        }

        // 3. Database Lokal HP (IndexedDB)
        let db;
        const request = indexedDB.open("MySpotifyAPK_DB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("songs", { keyPath: "id" });
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            loadSavedOfflineSongs();
        };

        function loadSavedOfflineSongs() {
            if (!db) return;
            const tx = db.transaction("songs", "readonly");
            const store = tx.objectStore("songs");
            const getAll = store.getAll();
            getAll.onsuccess = () => {
                offlineSongs = getAll.result.map(item => ({
                    id: item.id,
                    title: item.title,
